<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني البسيط</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .product-card { background: #fff; border-radius: 10px; padding: 20px; max-width: 300px; margin: 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { width: 100%; border-radius: 8px; }
        h2 { color: #333; }
        .price { color: #27ae60; font-size: 1.2em; font-weight: bold; margin: 10px 0; }
        .btn { background: #25d366; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>أهلاً بكِ في متجري الإلكتروني 🛒</h1>
    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="منتج">
        <h2>ساعة عصرية أنيقة</h2>
        <p class="price">4500 دج</p>
        <a class="btn" href="https://wa.me/213000000000?text=أريد%20طلب%20ساعة%20عصرية%20أنيقة">اطلب عبر واتساب</a>
    </div>
</body>
</html>
